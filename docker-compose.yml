# Host network: MySQL (aaPanel) listens on 127.0.0.1 of the host.
x-common: &common
  env_file: .env
  network_mode: host
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # One-shot `prisma migrate deploy`; app restarts never rerun it.
  migrate:
    <<: *common
    build:
      context: .
      target: migrate
    image: meetspace-migrate:${APP_TAG:-latest}
    restart: "no"
    mem_limit: 256m
    environment:
      DB_HOST: 127.0.0.1

  app:
    <<: *common
    build:
      context: .
      target: runner
      args:
        # Read from .env at build time; changing it requires a rebuild.
        NEXT_PUBLIC_APP_MAINTAINER: ${NEXT_PUBLIC_APP_MAINTAINER:-}
    image: meetspace:${APP_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    mem_limit: 512m
    environment:
      DB_HOST: 127.0.0.1
      # Loopback only: nginx is the sole entry point (X-Real-IP trust depends on it).
      HOSTNAME: 127.0.0.1
      PORT: 8282
      NODE_OPTIONS: --max-old-space-size=384
